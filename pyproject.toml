[project]
name = "FinLabPy"
version = "0.1"
description = "Система Финансовая Лаборатория от Игоря Чечета."
readme = "README.md"
requires-python = ">=3.8.9"
authors = [{ name = "Igor Chechet", email = "example@example.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet",
]
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["FinLabPy*"]
exclude = ["Examples"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[project.urls]
Homepage = "https://github.com/cia76/FinLabPy"
Changelog = "https://github.com/cia76/FinLabPy/releases"
Issues = "https://github.com/cia76/FinLabPy/issues"
CI = "https://github.com/cia76/FinLabPy/actions"

